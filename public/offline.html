<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">
  <title>Offline · MediByte</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background: #ffffff;
      color: #111111;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .card {
      width: min(420px, 100%);
      padding: 1.5rem;
      border: 1px solid #999999;
      border-radius: 6px;
      background: #fff;
          }
    h1 { margin: .5rem 0; font-size: 1.5rem; }
    p { color: #5f5f5f; line-height: 1.55; }
    a {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      margin-top: .75rem;
      padding: .6rem 1rem;
      border-radius: 4px;
      background: #111111;
      color: #fff;
      font-weight: 600;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main class="card">
    <strong>MediByte</strong>
    <h1>You are offline</h1>
    <p>Your saved app shell is still available, but new health records need a connection. Reconnect and try again.</p>
    <a href="/dashboard">Try dashboard again</a>
  </main>
</body>
</html>
